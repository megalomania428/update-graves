---
EXTENDS: .megalinter-action.yml
TYPESCRIPT_STANDARD_PRE_COMMANDS:
  - command: |
      set -e
      stock='/node-deps/node_modules'
      root='/node-tstand'
      packages=(@earendil-works/pi-coding-agent@0.85.1 @earendil-works/pi-ai@0.85.1
        @earendil-works/pi-agent-core@0.85.1 typebox@1.3.7 @types/node@24.10.0)
      for name in ts-standard typescript; do
        version="$(node -p "require('${stock}/${name}/package.json').version")"
        [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] || exit 1
        packages+=("${name}@${version}")
      done
      mkdir -p "${root}"
      npm install --prefix "${root}" --no-save --global=false --workspaces=false \
        --package-lock=false --ignore-scripts --no-audit --no-fund "${packages[@]}"
    cwd: root
    continue_if_failed: false
  # TypeScript ignores NODE_PATH and searches node_modules up to the container root.
  - command: |
      target='/node-tstand/node_modules'
      [[ ! -L /node_modules ]] || exit 1
      mkdir -p /node_modules/@earendil-works /node_modules/@types
      for name in @earendil-works/pi-coding-agent @earendil-works/pi-ai \
        @earendil-works/pi-agent-core typebox @types/node; do
        source="$target/$name"
        destination="/node_modules/$name"
        if [[ ! -e "$destination" && ! -L "$destination" ]]; then
          ln -s "$source" "$destination"
        fi
        [[ "$destination" -ef "$source" ]] || exit 1
      done
    cwd: root
    continue_if_failed: false
TYPESCRIPT_STANDARD_CLI_EXECUTABLE:
  - /node-tstand/node_modules/.bin/ts-standard
