# cspell:ignore gomod
---
upstream:
  url: https://github.com/gilbertchen/duplicacy.git
  ref: c8530c4d0fd4b607fd3e0fd98db359f6d7a15a19
  version: 3.3.0
  patch: 1
  patch_width: 3
targets:
  - name: all
    patches: [patches]
    cache:
      paths: ["~/go/pkg/mod", "~/.cache/go-build"]
      key_files: ["scripts/**", "patches/**"]
    steps:
      - bash scripts/build.sh prepare
      - bash scripts/build.sh test
      - bash scripts/build.sh bin
      - bash scripts/build.sh gomod
